; Two processes, one container.
;
; The web process answers HTTP and enqueues work. The worker process owns every
; provider call, ffprobe/ffmpeg run and file import, one job at a time. They
; share /data/catalog.db (plus the per-source connection lock files under
; /data/locks), so either can restart without losing queued work.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=python run.py --host 0.0.0.0 --port 8770 --no-browser
directory=/app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false

[program:worker]
command=python worker.py
directory=/app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false

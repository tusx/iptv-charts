; Four processes, one container.
;
; Ordering is by priority (low first): Valkey becomes available before the
; web/bworker, gunicorn before the bworker that writes through it, and nginx
; last so the public socket only appears once the stack has been launched.
; Supervisor stops in reverse order, so nginx closes first and Valkey last.
;
; The web process only serves HTTP and enqueues work. bworker owns every
; provider call, ffprobe/ffmpeg run and file import, one unit at a time. They
; share /data/catalog.db (plus the per-source connection lock files under
; /data/locks), so either can restart without losing queued work.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

; RAM-only activity log. No persistence: the log is a short-lived UI stream,
; and SQLite remains the durable source of truth.
[program:valkey-server]
command=/usr/bin/valkey-server /app/valkey.conf
directory=/tmp
priority=10
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false

; One worker with eight threads mirrors the previous waitress setup: most
; requests are fast, but interactive search/release/grab calls wait for a
; bworker unit, and healthy requests must not starve. `wsgi:app` calls
; create_app() once; this process starts no background threads.
[program:gunicorn]
command=/opt/venv/bin/gunicorn --bind 127.0.0.1:8771 --workers 1 --worker-class gthread --threads 8 --timeout 3900 --graceful-timeout 30 --keep-alive 5 --access-logfile - --error-logfile - --chdir /app wsgi:app
directory=/app
environment=PATH="/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",PYTHONUNBUFFERED="1"
priority=20
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false

; The only process that runs heavy, provider-facing work. It has no listening
; socket. SIGTERM lets the current bounded unit finish; supervisor then kills
; the group after stopwaitsecs.
[program:bworker]
command=/opt/venv/bin/python /app/bworker.py
directory=/app
environment=PATH="/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",PYTHONUNBUFFERED="1"
priority=30
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false

; Public listener and reverse proxy. `daemon off` keeps nginx in the
; foreground so supervisor owns its lifecycle and its logs reach the
; container's stdout/stderr.
[program:nginx]
command=/usr/sbin/nginx -c /app/nginx.conf
directory=/app
priority=40
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false

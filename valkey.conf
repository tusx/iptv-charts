# Valkey (Redis protocol) for the bworker activity log.
#
# The log is a short-lived UI stream capped at 500 entries, not durable state;
# SQLite is the source of truth. Persistence is therefore disabled entirely
# (no RDB snapshots, no AOF) and the memory ceiling is deliberately tiny. A
# restart loses the page history, which is expected and harmless.
#
# Loopback only: the web and bworker are the only clients and both are in this
# container. No unix socket, no remote access.

bind 127.0.0.1
port 6379
protected-mode yes

# Run in the foreground so supervisor owns the process and collects its log.
daemonize no
supervised no
pidfile /tmp/valkey.pid
loglevel notice
logfile ""

# The store only ever holds one list plus an id counter.
databases 1

# RAM-only: `save ""` disables snapshotting and `appendonly no` disables the
# append-only file. The app never writes to disk on our behalf either.
save ""
appendonly no
dir /tmp

# 16 MiB is many times the 500-entry cap; noeviction makes a full server fail
# writes loudly instead of silently dropping the oldest entries out of band
# (the activity Lua script already trims at the cap).
maxmemory 16mb
maxmemory-policy noeviction

# nginx for IPTV Charts.
#
# nginx is the only public listener: it serves the vendored static assets
# directly and proxies every application route to gunicorn on loopback. The
# container runs as the unprivileged `app` user, so there is deliberately no
# `user` directive, the pid lives in /tmp, and every temp path is a flat
# directory under /tmp (the writable location the base image guarantees).

daemon off;

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    # One single-user browser app; eight proxied requests are in flight at
    # most during interactive waits, so this is generous.
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Must exist before nginx drops its pid/temp files there; flat paths avoid
    # creating nested directories as an unprivileged user.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    access_log /dev/stdout;

    # Backup archives are capped at 64 MiB by backup.MAX_ZIP_BYTES; leave
    # headroom for multipart/HTTP overhead rather than matching it exactly.
    client_max_body_size 128m;
    client_body_timeout 60s;

    upstream iptv_charts_app {
        server 127.0.0.1:8771;
        # Match gunicorn's gthread workers so repeated polls reuse the socket.
        keepalive 8;
    }

    server {
        listen 0.0.0.0:8770;
        server_name _;

        # Everything under /static/ is local: Font Awesome, Bootstrap and the
        # app's own JS/CSS. No CDN is contacted for any asset. Revalidate with
        # ETag/Last-Modified instead of a long max-age, because replacing the
        # container keeps the same URLs and a normal refresh must pick up the
        # matched HTML/JS pair immediately.
        location /static/ {
            alias /app/iptv_charts/static/;
            access_log off;
            add_header Cache-Control "no-cache" always;
        }

        # Explicit so the container HEALTHCHECK path is obvious:
        # /api/health -> nginx -> gunicorn -> Flask. It is the same proxy as
        # below, with a short timeout that fits the health check window.
        location = /api/health {
            proxy_pass http://iptv_charts_app;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            access_log off;
        }

        # All other routes: Flask pages, the JSON API, proxied poster images
        # and backup download/upload.
        location / {
            proxy_pass http://iptv_charts_app;
            proxy_http_version 1.1;

            # Preserve the client's original Host header (including its port).
            # Flask's loopback Host/Origin guard inspects exactly this value;
            # rewriting it to the upstream 127.0.0.1:8771 would lose the port
            # the browser used and make origin checks inconsistent.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Required for the upstream keepalive pool above.
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            # The longest synchronous request waits 3600s for a bworker unit
            # (batch movie probing). Both proxying directions must outlast it;
            # gunicorn's own timeout is 3900s as well.
            proxy_send_timeout 3900s;
            proxy_read_timeout 3900s;
        }
    }
}
